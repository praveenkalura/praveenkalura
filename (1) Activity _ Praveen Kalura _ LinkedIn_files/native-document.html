            <li class="carousel-slide carousel-slide-active" data-ssplayer-slide-index="0" style="width: 475px; height: 614px;"><img class="carousel-lazy-element carousel-slide-is-portrait carousel-element-loaded carousel-element-load-success" data-src="https://media.licdn.com/dms/image/v2/C4E1FAQH0h_n6KijmAQ/feedshare-document-images_800/feedshare-document-images_800/1/1616176231509?e=1777507200&amp;v=beta&amp;t=-yCDIy4V67PshGKU4237p4y1g-HyH_ZKSdMlYD8frN8" alt="Free Speech Suffers a Blow Free speech suffered a grievous blow in India this week. Professor Pratap Mehta, one of India’s finest political scientists, resigned from Ashoka University. Ashoka, for those who do not know, till this week was considered India’s likely competitor to Cambridge, Harvard, and Oxford in coming decades. Unfortunately, its actions this week make that less probable. Professor Mehta’s resignation came in the middle of the teaching quarter, and was so sudden that he pleaded in his resignation letter with the university to make arrangements for his driver, who would otherwise be left jobless. It is unlikely that such a resignation was premeditated. Mehta’s resignation was followed by Professor Arvind Subramanian’s resignation. Professor Subramanian, a renowned economist (and, full disclosure, a co-author of mine), is a former chief economic advisor to the Government of India. Two lines from his resignation letter are especially noteworthy: “That even Ashoka – with its private status and backing by private capital – can no longer provide a space for academic expression and freedom is ominously disturbing. Above all, that the University’s commitment to fight for and sustain the Ashoka vision is now open to question makes it difficult for me to continue being part of Ashoka.” The reality is that Professor Mehta is a thorn in the side of the establishment. He is no ordinary thorn because he skewers those in government and in high offices like the Supreme Court with vivid prose and thought-provoking arguments. It is not that he has much sympathy for the opposition either. As a true academic, he is an equal opportunity critic. He is, and I hope will continue to be, one of the intellectual leaders of liberalism in India." src="./1616176231509"></li><li class="carousel-slide" data-ssplayer-slide-index="1" style="width: 475px; height: 614px;" tabindex="-1" aria-hidden="true"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/C4E1FAQH0h_n6KijmAQ/feedshare-document-images_800/feedshare-document-images_800/2/1616176231509?e=1777507200&amp;v=beta&amp;t=Yx63yzFXlwvVCKXTkRu_vGnk1DTHP3Kr-_tKWomGcmA" alt="Yet liberalism has been set back by the actions of Ashoka University. It is unclear what exactly motivated Ashoka’s founders to remove their hitherto laudable protection. In his resignation letter, Pratap Mehta writes “After a meeting with Founders it has become abundantly clear to me that my association with the University may be considered a political liability.” That, coupled with Professor Subramanian’s statements, would suggest that Ashoka’s founders have succumbed to outside pressure to get rid of a troublesome critic. As an institution, the university should not take political sides. However, as the University of Chicago’s Kalven Committee said, “the neutrality of the university as an institution arises then not from a lack of courage nor out of indifference and insensitivity. It arises out of respect for free inquiry and the obligation to cherish a diversity of viewpoints. And this neutrality as an institution has its complement in the fullest freedom for its faculty and students as individuals to participate in political action and social protest.” Put differently, the role of a great university is to provide a protected space for its academicians and students to engage freely in open public debate, much as Indian universities like Nalanda and Taxila used to. And that freedom is necessary because as the Kalven committee emphasizes, “By design and by effect, it [the university] is the institution which creates discontent with the existing social arrangements and proposes new ones. In brief, a good university, like Socrates, will be upsetting.” A good university creates an environment where ideas for progress and change arise. Static societies where criticism is silenced are doomed societies, which eventually succumb to the weight of their authoritarianism and groupthink. Ashoka’s founders should have realized that their mission was indeed not to take political sides but to continue to protect the right of people" src="./1616176231509(1)"></li><li class="carousel-slide" data-ssplayer-slide-index="2" style="width: 475px; height: 614px;" tabindex="-1" aria-hidden="true"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/C4E1FAQH0h_n6KijmAQ/feedshare-document-images_800/feedshare-document-images_800/3/1616176231509?e=1777507200&amp;v=beta&amp;t=0jgciMeop0Dx7vYWJMo82FZZP8K_34vJBkq3v-W-TsU" alt="like Professor Mehta to speak, for in doing so, they were enabling Ashoka to make its greatest contribution to India’s wellbeing – identifying what is going wrong and encouraging us all to remedy it. If Ashoka’s founders believe they have comprised with the powers that be in the greater interests of the university, they are wrong. Free speech is the soul of a great university. By compromising on it, the founders have bartered away its soul. And if you show a willingness to barter your soul, is there any chance the pressures will go away? This is indeed a sad development for India."></li></ul></div>
